plugins {
    id 'com.android.application'
}

android {
    namespace 'com.circledev.notes'
    compileSdk 35

    defaultConfig {
        applicationId "com.circledev.notes"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "8.0-native"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }

}

dependencies {
}
